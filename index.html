<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07130e">
<title>Laboratório da Tabela Periódica</title>

<style>
:root{
  --bg:#07130e;
  --bg2:#0b1d14;
  --panel:#0d2118;
  --panel2:#11291f;
  --border:#234936;
  --text:#eef8f1;
  --muted:#91aa9b;
  --accent:#52d273;
  --accent2:#2cae59;
  --danger:#ff5f6d;
  --warning:#f4c95d;
  --info:#59b9ff;
  --shadow:0 12px 35px rgba(0,0,0,.28);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:
    radial-gradient(circle at top left,#123522 0,transparent 38%),
    radial-gradient(circle at bottom right,#10291c 0,transparent 35%),
    var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  user-select:none;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  height:100dvh;
  display:flex;
  flex-direction:column;
  padding:
    max(7px,env(safe-area-inset-top))
    max(7px,env(safe-area-inset-right))
    max(4px,env(safe-area-inset-bottom))
    max(7px,env(safe-area-inset-left));
  gap:7px;
}

/* CABEÇALHO */

header{
  flex:0 0 auto;
  min-height:42px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:7px 10px;
  border:1px solid var(--border);
  border-radius:12px;
  background:rgba(13,33,24,.88);
  box-shadow:var(--shadow);
}

.brand{
  min-width:0;
}

.brand h1{
  margin:0;
  font-size:clamp(15px,2vw,23px);
  line-height:1.05;
}

.brand p{
  margin:3px 0 0;
  color:var(--muted);
  font-size:clamp(8px,1vw,12px);
}

.header-actions{
  display:flex;
  gap:5px;
  flex-shrink:0;
}

.small-btn{
  border:1px solid var(--border);
  background:#122c20;
  color:var(--text);
  border-radius:8px;
  padding:6px 8px;
  font-size:11px;
}

.small-btn:hover{
  border-color:var(--accent);
}

/* ÁREA PRINCIPAL */

.main{
  flex:1 1 auto;
  min-height:0;
  display:grid;
  grid-template-columns:minmax(0,1.65fr) minmax(270px,.85fr);
  gap:7px;
}

/* TABELA */

.table-panel{
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:6px;
  border:1px solid var(--border);
  border-radius:12px;
  background:rgba(8,25,17,.84);
  padding:7px;
  box-shadow:var(--shadow);
}

.toolbar{
  flex:0 0 auto;
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  align-items:center;
}

.search{
  flex:1 1 150px;
  min-width:100px;
  border:1px solid var(--border);
  background:#091a11;
  color:var(--text);
  border-radius:8px;
  padding:7px 9px;
  outline:none;
}

.search:focus{
  border-color:var(--accent);
}

.filter{
  border:1px solid var(--border);
  background:#10271c;
  color:var(--text);
  border-radius:8px;
  padding:7px 8px;
  font-size:11px;
}

.legend{
  flex:0 0 auto;
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  color:var(--muted);
  font-size:8px;
}

.legend span{
  display:flex;
  align-items:center;
  gap:3px;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  display:inline-block;
}

/* Container query para tornar os símbolos proporcionais à tabela */
.periodic-wrap{
  flex:1 1 auto;
  min-height:0;
  min-width:0;
  overflow:hidden;
  container-type:inline-size;
}

.periodic{
  width:100%;
  height:100%;
  display:grid;
  grid-template-columns:repeat(18,minmax(0,1fr));
  grid-template-rows:repeat(10,minmax(0,1fr));
  gap:2px;
  min-width:0;
  min-height:0;
}

.element{
  position:relative;
  min-width:0;
  min-height:0;
  border:1px solid rgba(255,255,255,.09);
  border-radius:4px;
  background:#12281d;
  color:var(--text);
  padding:1px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  transition:.12s;
}

.element:hover{
  transform:translateY(-1px);
  border-color:var(--accent);
  z-index:2;
}

.element.hidden{
  visibility:hidden;
  pointer-events:none;
}

.element.dim{
  opacity:.12;
}

.element.selected{
  border:2px solid var(--accent);
  box-shadow:0 0 0 1px rgba(82,210,115,.18);
}

.element .number{
  position:absolute;
  top:1px;
  left:2px;
  font-size:clamp(5px,1.25cqw,10px);
  opacity:.65;
  line-height:1;
}

.element .symbol{
  font-size:clamp(7px,4.5cqw,22px);
  font-weight:800;
  line-height:.95;
  letter-spacing:-.04em;
}

.element .name{
  width:100%;
  text-align:center;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:clamp(4px,1.65cqw,10px);
  opacity:.78;
  line-height:1;
  margin-top:2px;
}

.element .qty{
  position:absolute;
  bottom:1px;
  right:2px;
  font-size:clamp(5px,1.2cqw,9px);
  color:var(--accent);
  font-weight:bold;
}

.cat-alkali{background:#49251d}
.cat-alkaline{background:#49391b}
.cat-transition{background:#163d36}
.cat-post{background:#293b2a}
.cat-metalloid{background:#2c3d26}
.cat-nonmetal{background:#183d2c}
.cat-halogen{background:#273b50}
.cat-noble{background:#3a2e4a}
.cat-lanthanide{background:#3b2940}
.cat-actinide{background:#41282f}
.cat-unknown{background:#2a2a2a}

/* PAINEL DIREITO */

.info-panel{
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  border:1px solid var(--border);
  border-radius:12px;
  background:rgba(13,33,24,.9);
  box-shadow:var(--shadow);
  overflow:hidden;
}

.tabs{
  flex:0 0 auto;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  border-bottom:1px solid var(--border);
}

.tab{
  border:0;
  border-right:1px solid var(--border);
  background:#0d2118;
  color:var(--muted);
  padding:8px 3px;
  font-size:10px;
}

.tab:last-child{
  border-right:0;
}

.tab.active{
  color:var(--text);
  background:#163625;
  box-shadow:inset 0 -2px 0 var(--accent);
}

/*
  Apenas o conteúdo do painel pode rolar.
  A barra fica totalmente invisível.
*/
.tab-content{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  scrollbar-width:none;
  -ms-overflow-style:none;
  padding:9px;
}

.tab-content::-webkit-scrollbar{
  width:0;
  height:0;
  display:none;
}

/* CONTEÚDO */

.empty{
  min-height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:var(--muted);
  gap:6px;
  padding:15px;
}

.empty-icon{
  font-size:30px;
  opacity:.6;
}

.section{
  border:1px solid var(--border);
  border-radius:9px;
  background:rgba(10,28,19,.72);
  padding:8px;
  margin-bottom:7px;
}

.section:last-child{
  margin-bottom:0;
}

.section-title{
  margin:0 0 6px;
  color:var(--accent);
  font-size:11px;
  font-weight:bold;
}

.element-header{
  display:flex;
  align-items:center;
  gap:9px;
}

.big-symbol{
  width:52px;
  height:52px;
  flex:0 0 52px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid var(--accent);
  border-radius:10px;
  background:#10291c;
  color:var(--accent);
  font-size:25px;
  font-weight:800;
}

.element-title{
  min-width:0;
}

.element-title h2{
  margin:0;
  font-size:17px;
}

.element-title p{
  margin:3px 0 0;
  color:var(--muted);
  font-size:10px;
}

.info-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:5px;
}

.info-item{
  min-width:0;
  border:1px solid rgba(255,255,255,.06);
  border-radius:6px;
  padding:5px;
  background:#0c2016;
}

.info-item .label{
  color:var(--muted);
  font-size:8px;
}

.info-item .value{
  margin-top:2px;
  font-size:10px;
  overflow-wrap:anywhere;
}

/* LABORATÓRIO */

.lab-list{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.lab-row{
  display:grid;
  grid-template-columns:35px minmax(0,1fr) auto;
  align-items:center;
  gap:6px;
  border:1px solid var(--border);
  border-radius:7px;
  padding:5px;
  background:#0b1e14;
}

.lab-symbol{
  font-size:16px;
  font-weight:bold;
  text-align:center;
  color:var(--accent);
}

.lab-info{
  min-width:0;
}

.lab-info strong{
  display:block;
  font-size:10px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.lab-info span{
  display:block;
  font-size:8px;
  color:var(--muted);
}

.qty-control{
  display:flex;
  align-items:center;
  gap:3px;
}

.qty-control button{
  width:23px;
  height:23px;
  padding:0;
  border:1px solid var(--border);
  border-radius:5px;
  background:#142e21;
  color:var(--text);
}

.qty-control output{
  min-width:20px;
  text-align:center;
  font-size:10px;
  font-weight:bold;
}

.formula-box{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:55px;
  border:1px solid var(--border);
  border-radius:9px;
  background:#091a11;
  color:var(--accent);
  font-size:25px;
  font-weight:bold;
  letter-spacing:.04em;
  padding:8px;
  text-align:center;
  overflow-wrap:anywhere;
}

.chemical-name{
  margin-top:6px;
  padding:7px;
  border-radius:7px;
  background:#12291c;
  border:1px solid #285b3b;
  text-align:center;
}

.chemical-name .small{
  color:var(--muted);
  font-size:8px;
  display:block;
  margin-bottom:2px;
}

.chemical-name strong{
  font-size:12px;
  color:var(--text);
}

.action-row{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}

.action{
  flex:1 1 100px;
  border:1px solid var(--border);
  border-radius:7px;
  padding:7px;
  background:#12301f;
  color:var(--text);
  font-size:10px;
}

.action.primary{
  background:#1a5b30;
  border-color:#2f8b4b;
}

.action:hover{
  border-color:var(--accent);
}

.result{
  font-size:10px;
  line-height:1.45;
  color:#dcebe1;
}

.result strong{
  color:var(--accent);
}

.result .good{
  color:var(--accent);
}

.result .warn{
  color:var(--warning);
}

.result .bad{
  color:var(--danger);
}

.result .info{
  color:var(--info);
}

.mono{
  font-family:Consolas,Monaco,monospace;
}

/* LEWIS */

.lewis{
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100px;
  overflow:auto;
  padding:8px;
}

.lewis-atom{
  position:relative;
  width:70px;
  height:70px;
  border:1px solid var(--accent);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--accent);
  font-weight:bold;
  font-size:18px;
  background:#10291c;
}

.electron{
  position:absolute;
  font-size:12px;
  color:#fff;
}

.e-top{top:-3px}
.e-right{right:-3px}
.e-bottom{bottom:-3px}
.e-left{left:-3px}

/* DESAFIOS */

.challenge{
  border:1px solid var(--border);
  border-radius:8px;
  padding:7px;
  margin-bottom:5px;
  background:#0b1e14;
}

.challenge:last-child{
  margin-bottom:0;
}

.challenge-head{
  display:flex;
  justify-content:space-between;
  gap:5px;
  align-items:center;
}

.challenge strong{
  font-size:10px;
}

.challenge small{
  color:var(--muted);
  font-size:8px;
}

.challenge button{
  margin-top:5px;
  width:100%;
  border:1px solid var(--border);
  background:#143321;
  color:var(--text);
  border-radius:6px;
  padding:6px;
  font-size:9px;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  z-index:50;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  background:rgba(0,0,0,.68);
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(500px,100%);
  max-height:min(80dvh,600px);
  overflow:auto;
  scrollbar-width:none;
  background:#0d2118;
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.modal-box::-webkit-scrollbar{
  width:0;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:9px;
}

.modal-head h3{
  margin:0;
  font-size:14px;
}

.close{
  border:1px solid var(--border);
  background:#132b20;
  color:var(--text);
  width:28px;
  height:28px;
  border-radius:7px;
}

/* FOOTER */

footer{
  flex:0 0 auto;
  text-align:center;
  color:red;
  font-weight:bold;
  font-size:9px;
  background:transparent;
  user-select:none;
  pointer-events:none;
  padding:1px;
}

/* MOBILE */
@media(max-width:850px){
  .main{grid-template-columns:minmax(0,1.45fr) minmax(210px,.85fr)}
  .tab{font-size:9px;padding:7px 2px}
  .tab-content{padding:7px}
  .section{padding:7px}
}
@media(max-width:650px){
  .app{gap:5px}
  header{min-height:37px;padding:6px 8px}
  .brand h1{font-size:14px}
  .brand p{display:none}
  .header-actions{display:none}
  .table-panel{padding:5px;gap:4px}
  .legend{display:none}
  .toolbar{gap:3px}
  .search{padding:5px 6px;font-size:10px}
  .filter{padding:5px 5px;font-size:9px}
  .element{border-radius:3px}
  .element .name{display:none}
  .element .symbol{font-size:clamp(7px,4.6cqw,19px)}
  .info-panel{border-radius:9px}
  .tabs{grid-template-columns:repeat(4,1fr)}
  .tab{font-size:7px;padding:6px 1px}
  .tab-content{padding:5px}
  .big-symbol{width:40px;height:40px;flex-basis:40px;font-size:19px}
  .element-title h2{font-size:12px}
  .element-title p{font-size:8px}
  .info-grid{grid-template-columns:1fr}
  .info-item{padding:4px}
  .info-item .label{font-size:7px}
  .info-item .value{font-size:8px}
  .formula-box{min-height:42px;font-size:17px}
  .chemical-name{padding:5px}
  .chemical-name strong{font-size:9px}
  .chemical-name .small{font-size:7px}
  .action{font-size:8px;padding:6px 3px}
  .lab-row{grid-template-columns:26px minmax(0,1fr)}
  .qty-control{grid-column:2;justify-content:flex-end}
  footer{font-size:7px}
}
@media(max-width:430px){
  .table-panel{padding:3px}
  .periodic{gap:1px}
  .element .number{display:none}
  .info-panel{min-width:0}
  .section-title{font-size:9px}
  .element-title h2{font-size:10px}
  .element-title p{font-size:7px}
  .big-symbol{width:34px;height:34px;flex-basis:34px;font-size:16px}
  .formula-box{font-size:15px}
}
@media(max-width:650px) and (orientation:portrait){
  .main{display:flex;flex-direction:column;gap:5px;min-height:0;overflow:hidden}
  .table-panel{flex:0 0 56%;min-height:0}
  .info-panel{flex:1 1 44%;min-height:0}
  .periodic-wrap{min-height:0}
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="brand">
    <h1>⚗ Laboratório da Tabela Periódica</h1>
    <p>Explore elementos, monte fórmulas e analise possíveis combinações químicas.</p>
  </div>

  <div class="header-actions">
    <button class="small-btn" id="randomBtn">🎲 Aleatório</button>
    <button class="small-btn" id="clearBtn">Limpar laboratório</button>
  </div>
</header>

<main class="main">

  <section class="table-panel">

    <div class="toolbar">
      <input
        id="search"
        class="search"
        type="search"
        placeholder="Pesquisar elemento..."
        autocomplete="off"
      >

      <select id="filter" class="filter">
        <option value="all">Todos</option>
        <option value="metal">Metais</option>
        <option value="nonmetal">Não metais</option>
        <option value="noble">Gases nobres</option>
        <option value="halogen">Halogênios</option>
      </select>
    </div>

    <div class="legend">
      <span><i class="dot" style="background:#49251d"></i>Alcalinos</span>
      <span><i class="dot" style="background:#49391b"></i>Alcalino-terrosos</span>
      <span><i class="dot" style="background:#163d36"></i>Transição</span>
      <span><i class="dot" style="background:#183d2c"></i>Não metais</span>
      <span><i class="dot" style="background:#273b50"></i>Halogênios</span>
      <span><i class="dot" style="background:#3a2e4a"></i>Gases nobres</span>
    </div>

    <div class="periodic-wrap">
      <div id="periodic" class="periodic"></div>
    </div>

  </section>

  <aside class="info-panel">

    <nav class="tabs">
      <button class="tab active" data-tab="element">Elemento</button>
      <button class="tab" data-tab="lab">Laboratório</button>
      <button class="tab" data-tab="analysis">Análise</button>
      <button class="tab" data-tab="challenges">Desafios</button>
    </nav>

    <div id="tabContent" class="tab-content"></div>

  </aside>

</main>

<footer>
  © 2026 André Luiz Silva Dias Borges. Todos os direitos reservados.
</footer>

</div>

<div id="modal" class="modal">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="modalTitle">Informação</h3>
      <button class="close" id="modalClose">×</button>
    </div>
    <div id="modalContent"></div>
  </div>
</div>

function createElementButton(e){
  const btn = document.createElement("button");
  btn.className = `element cat-${e.category}`;
  btn.dataset.symbol = e.symbol;
  btn.dataset.number = e.number;

  btn.innerHTML = `
    <span class="number">${e.number}</span>
    <span class="symbol">${e.symbol}</span>
    <span class="name">${e.name}</span>
    <span class="qty"></span>
  `;

  btn.addEventListener("click",()=>{
    addElement(e.symbol);
    showElement(e);
  });

  return btn;
}

function buildPeriodicTable(){
  const table = document.getElementById("periodic");
  table.innerHTML = "";

  /*
    Períodos 1-7.
    Lantanídeos e actinídeos são retirados da posição principal
    e apresentados nas duas linhas inferiores.
  */

  ELEMENTS.forEach(e=>{
    if(e.category==="lanthanide" || e.category==="actinide") return;

    const btn = createElementButton(e);

    btn.style.gridColumn = e.group;
    btn.style.gridRow = e.period;

    table.appendChild(btn);
  });

  // Espaços marcadores para os blocos f
  const markerLa = document.createElement("div");
  markerLa.className = "element cat-lanthanide";
  markerLa.style.gridColumn = 3;
  markerLa.style.gridRow = 6;
  markerLa.innerHTML = `<span class="symbol">57–71</span><span class="name">Lantanídeos</span>`;
  table.appendChild(markerLa);

  const markerAc = document.createElement("div");
  markerAc.className = "element cat-actinide";
  markerAc.style.gridColumn = 3;
  markerAc.style.gridRow = 7;
  markerAc.innerHTML = `<span class="symbol">89–103</span><span class="name">Actinídeos</span>`;

}

========================================================= */

function updateTableState(){
  const query = document.getElementById("search").value
    .trim()
    .toLowerCase();

  const filter = document.getElementById("filter").value;

  document.querySelectorAll(".element[data-symbol]").forEach(btn=>{
    const e = bySymbol[btn.dataset.symbol];

    const text =
      `${e.name} ${e.symbol} ${e.number}`.toLowerCase();

    const searchOk = !query || text.includes(query);

    let filterOk = true;

    if(filter==="metal"){
      filterOk = [
        "alkali",
        "alkaline",
        "transition",
        "post"
      ].includes(e.category);
    }

    if(filter==="nonmetal"){
      filterOk = [
        "nonmetal",
        "metalloid",
        "halogen"
      ].includes(e.category);
    }

    if(filter==="noble"){
      filterOk = e.category==="noble";
    }

    if(filter==="halogen"){
      filterOk = e.category==="halogen";
    }

    btn.classList.toggle("dim",!(searchOk && filterOk));

    const qty = selected[e.symbol] || 0;
    btn.classList.toggle("selected",qty>0);

    const q = btn.querySelector(".qty");
    if(q) q.textContent = qty>0 ? qty : "";
  });
}

function addElement(symbol){
  selected[symbol] = (selected[symbol] || 0) + 1;
  currentElement=bySymbol[symbol];

  updateTableState();
  checkChallenge();

  if(currentTab==="lab" || currentTab==="analysis" || currentTab==="challenges"){
    renderCurrentTab();
  }

  triggerOnlineIdentification();
}

function changeQuantity(symbol,delta){
  selected[symbol] = Math.max(
    0,
    (selected[symbol] || 0) + delta
  );

  if(selected[symbol]===0){
    delete selected[symbol];
  }

  updateTableState();
  checkChallenge();
  renderCurrentTab();
  triggerOnlineIdentification();
}

}

function getFormulaParts(){
  return Object.entries(selected)
    .map(([symbol,count])=>({
      symbol,
      count,
      element:bySymbol[symbol]
    }))
    .sort((a,b)=>a.element.number-b.element.number);
}

function subscript(n){
  if(n===1) return "";
  const map={
    0:"₀",1:"₁",2:"₂",3:"₃",4:"₄",
    5:"₅",6:"₆",7:"₇",8:"₈",9:"₉"
  };
  return String(n)
    .split("")
    .map(x=>map[x]||x)
    .join("");
}

function formulaHTML(parts=getFormulaParts()){
  if(!parts.length) return "—";

  return parts
    .map(p=>`${p.symbol}${subscript(p.count)}`)
    .join("");
}

function compositionKey(source){
  const obj={};

  if(Array.isArray(source)){
    source.forEach(p=>{
      if(p && p.symbol && p.count>0) obj[p.symbol]=p.count;
    });
  }else{
    Object.entries(source || {}).forEach(([symbol,count])=>{
      if(count>0) obj[symbol]=count;
    });
  }

  return Object.entries(obj)
    .sort((a,b)=>bySymbol[a[0]].number-bySymbol[b[0]].number)
    .map(([symbol,count])=>`${symbol}${count>1?count:""}`)
    .join("");
}

function canonicalFormula(){
  return compositionKey(selected);
}

function getLocalCompoundName(){
  return KNOWN_COMPOUNDS[canonicalFormula()] || null;
}

function getCompoundName(){
  const formula=canonicalFormula();
  const local=getLocalCompoundName();

  if(local) return local;

  if(compoundCache[formula]){
    return compoundCache[formula];
  }

  return {
    name:"Identificando fórmula online…",
    type:"Consultando PubChem"
  };
}

function getLanguage(){
  const lang=(navigator.language || "pt-BR").toLowerCase();

  if(lang.startsWith("pt")) return "pt";
  if(lang.startsWith("es")) return "es";
  if(lang.startsWith("fr")) return "fr";
  if(lang.startsWith("de")) return "de";
  if(lang.startsWith("it")) return "it";
  if(lang.startsWith("ja")) return "ja";
  if(lang.startsWith("ko")) return "ko";
  if(lang.startsWith("zh")) return "zh-CN";
  return "en";
}

async function translateChemicalName(name){
  const lang=getLanguage();

  if(!name || lang==="en") return name;

  try{
    const q=encodeURIComponent(name);
    const url=`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${encodeURIComponent(lang)}&dt=t&q=${q}`;
    const response=await fetch(url);

    if(!response.ok) return name;

    const data=await response.json();
    const translated=(data?.[0] || [])
      .map(x=>x?.[0] || "")
      .join("")
      .trim();

    return translated || name;
  }catch{
    return name;
  }
}

function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

async function identifyCompoundOnline(formula){
  if(!formula || Object.keys(selected).length<2) return;
  if(compoundCache[formula] || compoundPending[formula]) return;

  compoundPending[formula]=true;

  try{
    const encoded=encodeURIComponent(formula);
    const url=`https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/fastformula/${encoded}/property/Title,IUPACName,MolecularFormula,MolecularWeight/JSON`;
    const response=await fetch(url);

    if(!response.ok) throw new Error("Fórmula não encontrada.");

    const data=await response.json();
    const props=data?.PropertyTable?.Properties?.[0];

    if(!props) throw new Error("Nenhum resultado.");

    const rawName=props.IUPACName || props.Title || "Substância identificada";
    const translated=await translateChemicalName(rawName);

    compoundCache[formula]={
      name:translated,
      originalName:rawName,
      type:"Identificação química via PubChem",
      molecularFormula:props.MolecularFormula || formula,
      molecularWeight:props.MolecularWeight || null,
      displayFormula:props.MolecularFormula || formula
    };
  }catch{
    const local=getLocalCompoundName();

    compoundCache[formula]=local ? {
      ...local,
      type:`${local.type} — identificação local`
    } : {
      name:"Composto não identificado online",
      type:"A fórmula não retornou uma espécie específica na consulta externa",
      displayFormula:formula
    };
  }finally{
    delete compoundPending[formula];

    if(canonicalFormula()===formula){
      updateTableState();
      renderCurrentTab();
    }
  }
}

function getDisplayFormula(){
  const formula=canonicalFormula();
  const cached=compoundCache[formula];

  if(cached?.displayFormula){
    return escapeHTML(cached.displayFormula).replace(/(\d+)/g,subscript);
  }

  return formulaHTML();
}

function triggerOnlineIdentification(){
  if(Object.keys(selected).length>=2){
    identifyCompoundOnline(canonicalFormula());
  }
}

function generateChemicalName(){
  return {
    name:"Composto não identificado",
    type:"O nome será obtido pela identificação online."
  };
}

/* =========================================================
   MASSA MOLAR
========================================================= */

function molarMass(parts=getFormulaParts()){
  return parts.reduce(
    (sum,p)=>sum+p.element.mass*p.count,
    0
  );
}

function percentComposition(parts=getFormulaParts()){
  const total=molarMass(parts);

  return parts.map(p=>({
    ...p,
    percent:(p.element.mass*p.count/total)*100
  }));
}

========================================================= */

function analyzeFormula(){
  const parts=getFormulaParts();

  if(!parts.length){
    return {
      title:"Nenhuma combinação",
      html:"Adicione dois ou mais elementos ao laboratório para analisar uma possível combinação."
    };
  }

  const formula=canonicalFormula();
  const compound=getCompoundName();

  if(parts.length===1){
    return {
      title:"Substância simples",
      html:`
        <p>
          A seleção contém apenas <strong>${parts[0].element.name}</strong>.
        </p>
        <p>
          Fórmula: <strong class="mono">${formula}</strong>
        </p>
        <p>
          Trata-se de uma substância formada por um único elemento.
        </p>
      `
    };
  }

  const metals=parts.filter(p=>[
    "alkali",
    "alkaline",
    "transition",
    "post",
    "lanthanide",
    "actinide"
  ].includes(p.element.category));

  const nonmetals=parts.filter(p=>[
    "nonmetal",
    "halogen",
    "noble"
  ].includes(p.element.category));

  const noble=parts.filter(p=>p.element.category==="noble");

  const en=parts
    .map(p=>p.element.electronegativity)
    .filter(x=>x>0);

  const maxEN=en.length?Math.max(...en):0;
  const minEN=en.length?Math.min(...en):0;
  const delta=maxEN-minEN;

  let bond="Covalente";
  let explanation="Os elementos tendem a compartilhar elétrons.";

  if(noble.length){
    bond="Pouco provável";
    explanation="A presença de um gás nobre torna a formação de um composto comum pouco provável.";
  }else if(metals.length && nonmetals.length){
    bond="Provavelmente iônica";
    explanation="A combinação entre metal e não metal frequentemente envolve transferência de elétrons e formação de íons.";
  }else if(metals.length===parts.length){
    bond="Metálica / liga";
    explanation="Uma combinação exclusivamente metálica tende a formar uma liga ou solução sólida, dependendo das condições.";
  }else if(delta>=1.7){
    bond="Fortemente polar / possível caráter iônico";
    explanation="A diferença de eletronegatividade é elevada.";
  }else if(delta>=0.4){
    bond="Covalente polar";
    explanation="Existe diferença significativa de eletronegatividade entre os átomos.";
  }else{
    bond="Covalente apolar ou pouco polar";
    explanation="As eletronegatividades são próximas.";
  }

  return {
    title:"Análise da combinação",
    html:`
      <div class="section">
        <div class="section-title">Identificação</div>

        <div class="formula-box">${getDisplayFormula()}</div>

        <div class="chemical-name">
          <span class="small">Nome químico</span>
          <strong>${compound.name}</strong>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Tipo provável de ligação</div>
        <p class="result">
          <strong>${bond}</strong>
        </p>
        <p class="result">${explanation}</p>
      </div>

      <div class="section">
        <div class="section-title">Diferença de eletronegatividade</div>
        <p class="result">
          ΔEN ≈ <strong>${delta.toFixed(2)}</strong>
        </p>
      </div>

      <div class="section">
        <div class="section-title">Cargas/estados de oxidação comuns</div>
        ${parts.map(p=>`
          <p class="result">
            <strong>${p.element.name}</strong> (${p.symbol}):
            ${COMMON_CHARGES[p.symbol] || "variável / depende do composto"}
          </p>
        `).join("")}
      </div>

      <div class="section">
        <div class="section-title">Observação</div>
        <p class="result">
          Esta análise é uma previsão educacional. A existência e estabilidade
          real de uma substância dependem de condições como temperatura,
          pressão, meio, estado de oxidação e estrutura eletrônica.
        </p>
      </div>
    `
  };
}

function valenceElectrons(symbol){
  const groups={
    H:1,Li:1,Na:1,K:1,Rb:1,Cs:1,Fr:1,
    Be:2,Mg:2,Ca:2,Sr:2,Ba:2,Ra:2,
    B:3,Al:3,Ga:3,In:3,Tl:3,
    C:4,Si:4,Ge:4,Sn:4,Pb:4,
    N:5,P:5,As:5,Sb:5,Bi:5,
    O:6,S:6,Se:6,Te:6,Po:6,
    F:7,Cl:7,Br:7,I:7,At:7,
    He:2,Ne:8,Ar:8,Kr:8,Xe:8,Rn:8
  };

  return groups[symbol] || 0;
}

function renderLewis(){
  const parts=getFormulaParts();

  if(!parts.length){
    return `<div class="empty">Adicione elementos para visualizar uma representação simplificada.</div>`;
  }

  return `
    <div class="section">
      <div class="section-title">Representação eletrônica simplificada</div>

      <div class="lewis">
        ${parts.map(p=>{
          const electrons=valenceElectrons(p.symbol);

          return `
            <div class="lewis-atom" title="${p.element.name}">
              <span>${p.symbol}</span>
              ${electrons>=1?'<i class="electron e-top">•</i>':""}
              ${electrons>=2?'<i class="electron e-right">•</i>':""}
              ${electrons>=3?'<i class="electron e-bottom">•</i>':""}
              ${electrons>=4?'<i class="electron e-left">•</i>':""}
            </div>
          `;
        }).join("")}
      </div>

      <p class="result">
        Esta visualização mostra apenas uma aproximação dos elétrons de
        valência e não representa a geometria molecular completa.
      </p>
    </div>
  `;
}

const CHALLENGES=[
  {formula:"H2O",name:"Água",hint:"Use Hidrogênio + Oxigênio."},
  {formula:"NaCl",name:"Cloreto de sódio",hint:"Use Sódio + Cloro."},
  {formula:"CaCl2",name:"Cloreto de cálcio",hint:"Use Cálcio + Cloro."},
  {formula:"H2SO4",name:"Ácido sulfúrico",hint:"Use Hidrogênio + Enxofre + Oxigênio."},
  {formula:"CO2",name:"Dióxido de carbono",hint:"Use Carbono + Oxigênio."},
  {formula:"NH3",name:"Amônia",hint:"Use Nitrogênio + Hidrogênio."},
  {formula:"CH4",name:"Metano",hint:"Use Carbono + Hidrogênio."},
  {formula:"MgO",name:"Óxido de magnésio",hint:"Use Magnésio + Oxigênio."}
];

function currentChallenge(){
  return CHALLENGES[challengeIndex % CHALLENGES.length];
}

function startChallenge(){
  challengeStarted=true;
  challengeSolved=false;
  challengeMessage="";
  selected={};
  currentAnalysis=null;

  updateTableState();
  currentTab="challenges";
  document.querySelectorAll(".tab").forEach(t=>{
    t.classList.toggle("active",t.dataset.tab==="challenges");
  });
  renderCurrentTab();
}

function checkChallenge(){
  if(!challengeStarted || challengeSolved) return;

  const ch=currentChallenge();
  const targetKey=compositionKey(parseFormula(ch.formula));
  const currentKey=compositionKey(selected);

  if(currentKey===targetKey){
    challengeSolved=true;
    challengeMessage=`Você conseguiu! A combinação corresponde a <strong>${escapeHTML(ch.name)}</strong>.`;
  }else if(currentKey){
    challengeMessage="Ainda não. Continue ajustando os elementos e as quantidades.";
  }else{
    challengeMessage="";
  }
}

function nextChallenge(){
  challengeIndex=(challengeIndex+1)%CHALLENGES.length;
  challengeStarted=false;
  challengeSolved=false;
  challengeMessage="";
  selected={};
  currentAnalysis=null;

  updateTableState();
  currentTab="challenges";
  document.querySelectorAll(".tab").forEach(t=>{
    t.classList.toggle("active",t.dataset.tab==="challenges");
  });
  renderCurrentTab();
}

function parseFormula(formula){
  const result={};
  const regex=/([A-Z][a-z]?)(\d*)/g;
  let m;

  while((m=regex.exec(formula))){
    result[m[1]]=(result[m[1]]||0)+(Number(m[2])||1);
  }

  return result;
}

function challenge(ch){
  challengeIndex=CHALLENGES.indexOf(ch);
  if(challengeIndex<0){
    challengeIndex=CHALLENGES.findIndex(x=>x.formula===ch.formula);
  }
  if(challengeIndex<0) challengeIndex=0;
  startChallenge();
}

    currentElement=e;

    currentTab="element";

    document.querySelectorAll(".tab").forEach(t=>{
      t.classList.toggle(
        "active",
        t.dataset.tab==="element"
      );
    });

    renderCurrentTab();
  });

/* =========================================================
   PUBCHEM
========================================================= */

async function lookupPubChem(){
  const formula=canonicalFormula();

  if(!formula){
    showModal(
      "Consulta",
      `<p class="result">Monte uma fórmula primeiro.</p>`
    );
    return;
  }

  showModal(
    "Consulta ao PubChem",
    `<p class="result">Consultando informações para <strong>${formula}</strong>...</p>`
  );

  try{
    const encoded=encodeURIComponent(formula);

    const url=
      `https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/fastformula/${encoded}/property/Title,IUPACName,MolecularFormula,MolecularWeight,CanonicalSMILES,IsomericSMILES,InChI,InChIKey/JSON`;

    const response=await fetch(url);

    if(!response.ok){
      throw new Error("Substância não encontrada.");
    }

    const data=await response.json();

    const props=data?.PropertyTable?.Properties?.[0];

    if(!props){
      throw new Error("Nenhum resultado.");
    }

    const onlineName=await translateChemicalName(
      props.IUPACName || props.Title || "Não informado"
    );

    showModal(
      `PubChem — ${formula}`,
      `
        <div class="section">
          <div class="section-title">Nome encontrado</div>
          <p class="result">
            <strong>${escapeHTML(onlineName)}</strong>
          </p>
        </div>

        <div class="section">
          <div class="section-title">Fórmula</div>
          <p class="result mono">
            ${props.MolecularFormula || formula}
          </p>
        </div>

        <div class="section">
          <div class="section-title">Massa molecular</div>
          <p class="result">
            ${props.MolecularWeight || "—"}
          </p>
        </div>

        <div class="section">
          <div class="section-title">Canonical SMILES</div>
          <p class="result mono">
            ${props.CanonicalSMILES || "—"}
          </p>
        </div>

        <div class="section">
          <div class="section-title">Isomeric SMILES</div>
          <p class="result mono">
            ${props.IsomericSMILES || "—"}
          </p>
        </div>

        <div class="section">
          <div class="section-title">InChI</div>
          <p class="result mono">
            ${props.InChI || "—"}
          </p>
        </div>

        <div class="section">
          <div class="section-title">InChIKey</div>
          <p class="result mono">
            ${props.InChIKey || "—"}
          </p>
        </div>
      `
    );

  }catch(error){
    const local=getCompoundName();

    showModal(
      "Resultado",
      `
        <div class="section">
          <div class="section-title">Fórmula analisada</div>

          <div class="formula-box">${getDisplayFormula()}</div>

          <div class="chemical-name">
            <span class="small">Nome localmente identificado</span>
            <strong>${local.name}</strong>
          </div>
        </div>

        <p class="result warn">
          A consulta externa não retornou um registro específico para
          esta fórmula.
        </p>

        <p class="result">
          Isso não significa necessariamente que a substância não exista.
          Algumas fórmulas dependem de representação estrutural,
          estado de oxidação ou nomenclatura específica.
        </p>
      `
    );
  }
}

/* =========================================================
   MODAL
========================================================= */

function showModal(title,html){
  document.getElementById("modalTitle").textContent=title;
  document.getElementById("modalContent").innerHTML=html;
  document.getElementById("modal").classList.add("show");
}

document.getElementById("modalClose")
  .addEventListener("click",()=>{
    document.getElementById("modal").classList.remove("show");
  });

document.getElementById("modal")
  .addEventListener("click",e=>{
    if(e.target.id==="modal"){
      e.currentTarget.classList.remove("show");
    }
  });
